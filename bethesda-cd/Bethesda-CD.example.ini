# Bethesda CD - settings. The program writes this file itself, beside Bethesda-CD.exe, as
# "Bethesda-CD.ini" the first time someone signs in; this is only an example.
# Never a password: the program does not keep one.
#
# The address of the EMR (the clinic's server), as typed at the first sign-in:
emr_url=http://192.168.1.10:9080
# The last folder a copy was saved in:
last_folder=
# The language of the window: fr (default), ko or en.
lang=fr
