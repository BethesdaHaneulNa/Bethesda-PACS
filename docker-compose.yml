services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: bethesda-pacs
    restart: unless-stopped
    ports:
      - "8090:8042"      # web UI / viewer / REST / DICOMweb
      - "4242:4242"      # DICOM (C-STORE from devices, modality worklist)
    environment:
      # ── general ──
      ORTHANC__NAME: "Bethesda PACS"
      ORTHANC__DICOM_AET: "MEDCONNECT"
      ORTHANC__DICOM_CHECK_CALLED_AET: "false"   # accept any device for now (internal LAN)
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      # allow imaging devices to query worklist / find / send without pre-registering each AET (internal LAN)
      ORTHANC__DICOM_ALWAYS_ALLOW_FIND_WORKLIST: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_FIND: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_STORE: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_ECHO: "true"
      # ── login ── password comes from .env (ORTHANC_PASSWORD), generated by setup.
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"admin": "${ORTHANC_PASSWORD:-change-me-orthanc}"}'
      # ── modality worklist (devices pull patient/order info) ──
      WORKLISTS_PLUGIN_ENABLED: "true"
      ORTHANC__WORKLISTS__ENABLE: "true"
      ORTHANC__WORKLISTS__DATABASE: "/var/lib/orthanc/worklists"
      # ── web access (DICOMweb REST + viewers) ──
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__ENABLE: "true"
      STONE_WEB_VIEWER_PLUGIN_ENABLED: "true"
      ORTHANC_EXPLORER_2_ENABLED: "true"
    volumes:
      - ./storage:/var/lib/orthanc/db          # DICOM images + index (persist)
      - ./worklists:/var/lib/orthanc/worklists # .wl worklist files written by the EMR bridge

  # EMR → worklist bridge: polls the EMR MWL feed and writes .wl files for Orthanc
  worklist-bridge:
    build: ./bridge
    container_name: bethesda-worklist-bridge
    restart: unless-stopped
    environment:
      EMR_FEED_URL: "${EMR_FEED_URL:-http://host.docker.internal:8080/api/pacs/worklist-feed}"   # = Settings → Order Feed URL
      BRIDGE_TOKEN: "${BRIDGE_TOKEN:-change-me-bridge-token}"   # must match Settings → Order Feed → Bridge Token
      WL_DIR: "/worklists"
      POLL_SECONDS: "15"
    volumes:
      - ./worklists:/worklists
    extra_hosts:
      - "host.docker.internal:host-gateway"
