# Fixed project name so re-downloading a newer version keeps your existing images/index.
name: bethesda-pacs

services:
  orthanc:
    # Pinned on purpose: ":latest" would silently upgrade Orthanc on any pull/restart,
    # which can break a running clinic with nobody around to diagnose it. Bump this
    # number deliberately (and test) when you want a new version.
    image: orthancteam/orthanc:26.9.1
    container_name: bethesda-pacs
    restart: unless-stopped
    # Before Orthanc's own start-up: is the image store really there? It is recognised by
    # its marker file (setup and move-image-storage.ps1 write it) or by an existing image
    # index. When the store's drive is missing or has another letter, Docker Desktop makes
    # an EMPTY folder of that name; Orthanc started on it would look healthy, hold nothing
    # and take in what devices send - the real images would seem gone. So it does not start:
    # this container keeps restarting and says why (docker logs bethesda-pacs) until the
    # store is back. Orthanc itself is started unchanged, by its own entrypoint.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /var/lib/orthanc/db/BETHESDA-PACS-STORAGE.id ] && [ ! -f /var/lib/orthanc/db/index ]; then
          echo 'BETHESDA PACS: the image store is not there (no BETHESDA-PACS-STORAGE.id and no image index in the storage folder).' >&2
          echo 'Is the disk of ORTHANC_STORAGE_PATH connected, under the same drive letter? The image server is NOT started on an empty folder.' >&2
          echo 'Connect the disk and run start.bat again. A first installation is made with start.bat (setup), which prepares the folder.' >&2
          sleep 30
          exit 1
        fi
        exec /docker-entrypoint.sh /tmp/orthanc.json
    ports:
      # Web UI / REST / DICOMweb on this machine only (P-9): staff see images
      # through the EMR, which reaches this port via host.docker.internal and adds
      # the login itself. Orthanc's admin pages: http://localhost:9090 on the server.
      - "127.0.0.1:9090:8042"
      - "4242:4242"      # DICOM (C-STORE from devices, modality worklist)
    environment:
      # ── general ──
      ORTHANC__NAME: "Bethesda PACS"
      ORTHANC__DICOM_AET: "MEDCONNECT"
      ORTHANC__DICOM_CHECK_CALLED_AET: "false"   # accept any device for now (internal LAN)
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      # allow imaging devices to query worklist / find / send without pre-registering each AET (internal LAN)
      ORTHANC__DICOM_ALWAYS_ALLOW_FIND_WORKLIST: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_FIND: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_STORE: "true"
      ORTHANC__DICOM_ALWAYS_ALLOW_ECHO: "true"
      # Also store image types Orthanc does not know (vendor-private SOP classes).
      # Without this they are refused silently: the device shows an error and the
      # PACS log shows nothing, which nobody on site could diagnose (old devices of
      # unknown model; coordinator decision 2026-09-30). They take disk space, and
      # the viewer may show nothing for them. To go back: "false", then
      # docker compose up -d (Orthanc restarts).
      ORTHANC__UNKNOWN_SOP_CLASS_ACCEPTED: "true"
      # ── login ── password comes from .env (ORTHANC_PASSWORD), generated by setup.
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"admin": "${ORTHANC_PASSWORD:-change-me-orthanc}"}'
      # ── modality worklist (devices pull patient/order info) ──
      WORKLISTS_PLUGIN_ENABLED: "true"
      ORTHANC__WORKLISTS__ENABLE: "true"
      ORTHANC__WORKLISTS__DATABASE: "/var/lib/orthanc/worklists"
      # ── web access (DICOMweb REST + viewers) ──
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__DICOM_WEB__ENABLE: "true"
      STONE_WEB_VIEWER_PLUGIN_ENABLED: "true"
      # Stone's "Intended use" box at start leaves the image area black after it
      # is closed (the picture only appears once the window is resized). The
      # "not for diagnostic usage" notice stays on the left panel regardless.
      ORTHANC__STONE_WEB_VIEWER__SHOW_INFO_PANEL_AT_STARTUP: "Never"
      ORTHANC_EXPLORER_2_ENABLED: "true"
    volumes:
      # DICOM images + index (persist). Where: ORTHANC_STORAGE_PATH in .env - a folder on
      # another drive, e.g. D:/Bethesda-PACS-images (setup asks; move-image-storage.ps1 moves
      # an existing store). Not set: ./storage in this folder, as it always was.
      - ${ORTHANC_STORAGE_PATH:-./storage}:/var/lib/orthanc/db
      - ./worklists:/var/lib/orthanc/worklists # .wl worklist files written by the EMR bridge
    # Ask Orthanc's own REST API rather than trusting that the process is still
    # running. /system needs a login, so 401 is a perfectly good answer here: it
    # proves the server is listening and serving, which is the question.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8042,timeout=5); c.request('GET','/system'); sys.exit(0 if c.getresponse().status in (200,401) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # EMR → worklist bridge: polls the EMR MWL feed and writes .wl files for Orthanc
  worklist-bridge:
    build: ./bridge
    # Named so the offline install kit can `docker save` it — see the EMR's
    # OFFLINE-INSTALL.md. Compose picks this name implicitly anyway.
    image: bethesda-pacs-worklist-bridge:latest
    container_name: bethesda-worklist-bridge
    restart: unless-stopped
    environment:
      EMR_FEED_URL: "${EMR_FEED_URL:-http://host.docker.internal:9080/api/pacs/worklist-feed}"   # = Settings → Order Feed URL
      # From .env (setup generates it); must match EMR Settings → Order Feed → Bridge Token.
      # No fallback: the EMR refuses the old published placeholder anyway.
      BRIDGE_TOKEN: "${BRIDGE_TOKEN:-}"
      WL_DIR: "/worklists"
      STORAGE_DIR: "/storage"   # the image store, read-only: only to say how much room its disk has left
      POLL_SECONDS: "15"
      # To see which scheduled studies have arrived, so finished patients leave
      # the device worklist. Same login as the web viewer (Orthanc has one user).
      ORTHANC_URL: "http://orthanc:8042"
      ORTHANC_USER: "admin"
      ORTHANC_PASSWORD: "${ORTHANC_PASSWORD:-}"
    volumes:
      - ./worklists:/worklists
      - ${ORTHANC_STORAGE_PATH:-./storage}:/storage:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The bridge has no port to knock on, so it leaves timestamps instead:
    # .heartbeat after every cycle (a stale one means the loop is wedged), and
    # .feed_ok after every cycle in which the EMR's feed really answered. Both
    # must be fresh: in 2026-09 another program sat on port 9080, every cycle
    # failed, and the bridge still showed "healthy" while no worklist went out.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; f=lambda p,s: os.path.exists(p) and time.time()-float(open(p).read()) < s; sys.exit(0 if f('/worklists/.heartbeat',60) and f('/worklists/.feed_ok',120) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 30s
